<section class="carousel" aria-labelledby="carousel-title">
	<div class="carousel__header"><button type="button">Section 1</button></div>

	<div class="carousel__preview" [style.background-color]="destinations[activeIndex()].color">
		<div class="carousel__preview-content">
			<p id="carousel-title">Carousel</p>
			<h1>{{ destinations[activeIndex()].title }}</h1>
		</div>
		<div class="carousel__controls">
			<button type="button" class="arrow-button" aria-label="Destino anterior" (click)="previous()">&#8592;</button>
			<div class="carousel__dots" aria-label="Selecionar destino">
				@for (destination of destinations; track destination.title; let index = $index) {
					<button type="button" class="dot" [class.dot--active]="activeIndex() === index" [attr.aria-label]="'Selecionar ' + destination.title" (click)="select(index)"></button>
				}
			</div>
			<button type="button" class="arrow-button" aria-label="Próximo destino" (click)="next()">&#8594;</button>
		</div>
	</div>

	<div class="cards-grid">
		@for (destination of destinations; track destination.title; let index = $index) {
			<button type="button" class="destination-card" [style.background-color]="destination.color" (click)="select(index)" [attr.aria-label]="'Selecionar ' + destination.title">
				<div class="destination-card__number">{{ destination.number }}</div>
				<div class="destination-card__content">
					<p class="destination-card__location">{{ destination.location }}</p>
					<h2>{{ destination.title }}</h2>
				</div>
			</button>
		}
	</div>
</section>
